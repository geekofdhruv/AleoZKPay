# DigitalOcean App Spec for NullPay Backend
name: nullpay-backend
region: nyc # You can change this to your preferred region (e.g., fra, sgp, ams)
services:
  - name: nullpay-api
    instance_count: 1
    instance_size_slug: basic-xxs # Lowest tier (~$5/mo)
    http_port: 3000
    source_dir: backend
    dockerfile_path: Dockerfile
    # List of ENV keys (values will be set in DO Dashboard for security)
    envs:
      - key: PORT
        scope: RUN_AND_BUILD_TIME
        value: "3000"
      - key: SUPABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: SUPABASE_ANON_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ENCRYPTION_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: RELAYER_PRIVATE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: PROVABLE_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: PROVABLE_CONSUMER_ID
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: GOOGLE_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ORACLE_PRIVATE_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: BREVO_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
