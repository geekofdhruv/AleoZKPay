name: App Platform Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: "Run Logic Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Run Tests
        # We use a dummy env for tests to ensure they don't fail due to missing keys
        run: |
          cd backend
          npm test
        env:
          PORT: 3000
          SUPABASE_URL: "https://example.supabase.co"
          SUPABASE_ANON_KEY: "dummy"
          ENCRYPTION_KEY: "f2d5e83000ddc5c05476a794ba330690e47bd0a2b3c4d7fbe524bab894568f0b"

  deploy:
    name: "Deploy Preview App"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy the app
        id: deploy
        uses: digitalocean/app_action/deploy@v2
        with:
          deploy_pr_preview: "true"
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          # Path to your app spec file
          path: .do/app.yaml

      - name: Comment on Failure
        if: failure()
        uses: actions/github-script@v7
        env:
          BUILD_LOGS: ${{ steps.deploy.outputs.build_logs }}
          DEPLOY_LOGS: ${{ steps.deploy.outputs.deploy_logs }}
        with:
          script: |
            const { BUILD_LOGS, DEPLOY_LOGS } = process.env
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **Deployment Failed**

              The app failed to be deployed. You can find the full run [here](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).

              ### 🛠️ Build Logs
              <details>
              <summary>Click to expand</summary>
              
              \`\`\`
              ${BUILD_LOGS || 'No build logs available.'}
              \`\`\`
              
              </details>

              ### 🚀 Deploy Logs
              <details>
              <summary>Click to expand</summary>
              
              \`\`\`
              ${DEPLOY_LOGS || 'No deploy logs available.'}
              \`\`\`
              
              </details>`
            })
